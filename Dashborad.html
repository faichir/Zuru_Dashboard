<!DOCTYPE html>
<html lang="en">
<head>
<base target="_top">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Zuru World dashboard</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--navy:#12362B;--ink:#12362B;--muted:#5E766B;--teal:#168F54;--teal2:#6CC79A;--sky:#E6F1EA;--green:#168F54;--amber:#C9971C;--gold:#D4A322;--red:#D9534F;--grey:#8FA39A}
*{box-sizing:border-box}
body{margin:0;color:var(--ink);font-family:Inter,system-ui,-apple-system,"Segoe UI",Arial,sans-serif;line-height:1.5;min-height:100vh;
 background:radial-gradient(1200px 500px at 85% -10%,#DCEBDD 0,transparent 60%),linear-gradient(160deg,#F4F7F1 0%,#E2EEE5 100%)}
.wrap{max-width:1120px;margin:0 auto;padding:24px 20px 56px}
header{display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap;margin-bottom:22px}
.brand{display:flex;align-items:center;gap:12px}
.wordmark{height:44px;width:auto;display:block;margin-bottom:4px}.logo{width:46px;height:46px;border-radius:12px;background:#fff;display:grid;place-items:center;box-shadow:0 2px 10px rgba(18,54,43,.12)}.logo svg{width:32px;height:32px}
h1{font-size:22px;margin:0;font-weight:700}
.sub{color:var(--muted);font-size:13px}
button{font:inherit;font-size:13px;font-weight:600;color:var(--navy);background:#fff;border:0;border-radius:999px;padding:9px 18px;cursor:pointer;box-shadow:0 2px 10px rgba(18,54,43,.12)}
button:hover{background:var(--navy);color:#fff}
button:focus-visible{outline:3px solid var(--teal);outline-offset:2px}
h2{font-size:15px;margin:0 0 14px;font-weight:600}
.card{background:rgba(255,255,255,.82);border:1px solid rgba(255,255,255,.9);border-radius:20px;padding:20px 22px;box-shadow:0 8px 28px rgba(18,54,43,.08);margin-bottom:18px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:18px}
.grid3 .card{margin-bottom:0}
.row{display:grid;grid-template-columns:1.2fr 1fr;gap:18px;margin-top:18px}
.row .card{margin-bottom:0}
.hero{background:linear-gradient(145deg,#0F2E25,#1B5A43);color:#fff}
.hero .sub{color:#BFDCCD}
.big{font-size:40px;font-weight:700;line-height:1.1;letter-spacing:-.02em}
.big small{font-size:16px;font-weight:500;opacity:.7;letter-spacing:0}
.pill{display:inline-block;font-size:12px;font-weight:600;padding:3px 10px;border-radius:999px;background:var(--sky);color:var(--navy)}
.hero .pill{background:rgba(255,255,255,.18);color:#fff}
.track{height:10px;background:rgba(255,255,255,.22);border-radius:6px;overflow:hidden;margin:14px 0 6px}
.track i{display:block;height:100%;background:linear-gradient(90deg,#B98B16,var(--gold),#F0D27A);border-radius:6px}
.gauge{width:100%;max-width:230px;display:block;margin:2px auto 0}
.gnum{text-align:center;margin-top:-52px;margin-bottom:26px}
.gnum b{font-size:34px;font-weight:700}
.two{display:flex;justify-content:space-between;gap:12px}
.two>div{flex:1}
.attn ul{list-style:none;margin:0;padding:0}
.attn li{display:flex;gap:10px;padding:10px 12px;margin-bottom:8px;background:var(--sky);border-radius:14px;font-size:14px}
.dot{flex:none;width:10px;height:10px;border-radius:50%;margin-top:8px}
.red{background:var(--red)}.amber{background:var(--amber)}.grey{background:var(--grey)}.green{background:var(--green)}
.person{display:flex;align-items:center;gap:12px;padding:10px 0;border-top:1px solid #E1ECE4}
.person:first-of-type{border-top:0}
.av{flex:none;width:40px;height:40px;border-radius:50%;background:linear-gradient(135deg,var(--gold),var(--teal));color:#fff;display:grid;place-items:center;font-weight:600}
.pbody{flex:1;min-width:0}
.pt{display:flex;justify-content:space-between;gap:8px;font-size:14px}
.bar{height:8px;background:#DDE9E0;border-radius:5px;overflow:hidden;margin:5px 0 3px}
.bar>i{display:block;height:100%;background:linear-gradient(90deg,var(--teal),var(--teal2));border-radius:5px}
.tag{font-weight:600;font-size:12px;white-space:nowrap}
.tag::before{content:"";display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--c);margin-right:6px}
.cols{display:flex;align-items:flex-end;gap:10px;height:190px}
.col{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;height:100%;min-width:0}
.col b{font-size:12px;margin-bottom:4px}
.col i{display:block;width:100%;max-width:46px;border-radius:10px 10px 4px 4px;background:linear-gradient(180deg,var(--teal2),var(--teal));min-height:6px}
.col i.low{background:linear-gradient(180deg,#F6B7B3,var(--red))}
.col i.mid{background:linear-gradient(180deg,#F1DFA3,#D4A322)}
.col span{font-size:11px;color:var(--muted);margin-top:8px;text-align:center;line-height:1.25;height:42px;overflow:hidden}
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;font-weight:600;color:var(--muted);padding:6px 8px 6px 0}
td{padding:9px 8px 9px 0;border-top:1px solid #E1ECE4}
.scroll{overflow-x:auto}
.note{color:var(--muted);font-size:12px;margin:12px 0 0}
.empty{color:var(--muted);font-size:14px;margin:0}
#err{display:none;background:#fff;border:1px solid var(--red);border-radius:16px;padding:16px 20px;margin-bottom:18px}
@media (max-width:820px){.grid3,.row{grid-template-columns:1fr}.grid3 .card{margin-bottom:0}}
</style>
</head>

    <button id="refresh" type="button">Refresh now</button>
  </header>
  <div id="err" role="alert"></div>
  <div id="app"></div>
</div>
<script>
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function pct(x){return Math.round((Number(x)||0)*100)}
function statusColor(s){s=String(s||'');
  if(s==='On track'||s==='On pace'||s==='Target met')return 'var(--green)';
  if(s==='Watch')return 'var(--amber)';
  if(s==='Needs attention'||s==='Below pace'||s==='Deadline passed')return 'var(--red)';
  return 'var(--grey)';}
function tag(s){return '<span class="tag" style="--c:'+statusColor(s)+'">'+esc(s||'—')+'</span>'}
function bar(p){return '<div class="bar" role="img" aria-label="'+pct(p)+' percent"><i style="width:'+Math.min(100,pct(p))+'%"></i></div>'}

function render(d){
  var o=d.outreach,g=d.guides;
  document.getElementById('stamp').textContent='Live from the sheet · updated '+d.updatedAt;
  var op=o.listed?o.contacted/o.listed:0, gp=g.target?Math.min(1,g.onboard/g.target):0;
  var real=d.attention.filter(function(a){return a.level!=='grey'}).length;
  var h='';

  h+='<div class="grid3">'
   +'<div class="card hero"><div class="two"><div class="sub">Client outreach</div><span class="pill">'+pct(op)+'% contacted</span></div>'
   +'<div class="big" style="margin-top:10px">'+esc(o.contacted)+' <small>of '+esc(o.listed)+' companies</small></div>'
   +'<div class="track"><i style="width:'+pct(op)+'%"></i></div>'
   +'<div class="sub">'+esc(o.followUpSent)+' follow-ups sent · '+esc(o.notContacted)+' still to contact</div></div>'

   +'<div class="card"><h2>Replies and follow-ups</h2><div class="two">'
   +'<div><div class="big">'+esc(o.replies)+'</div><div class="sub">client replies</div></div>'
   +'<div><div class="big" style="color:'+(o.followUpDue>0?'var(--red)':'var(--green)')+'">'+esc(o.followUpDue)+'</div><div class="sub">follow-ups due now</div></div></div>'
   +'<p class="note">Reply rate '+(o.contacted?(o.replies/o.contacted*100).toFixed(1):'0')+'% of companies contacted.</p></div>'

   +'<div class="card"><h2>Guides onboard</h2>'
   +'<svg class="gauge" viewBox="0 0 200 110" aria-hidden="true"><defs><linearGradient id="gg" x1="0" x2="1"><stop offset="0" stop-color="#D4A322"/><stop offset="1" stop-color="#168F54"/></linearGradient></defs>'
   +'<path d="M12 100 A88 88 0 0 1 188 100" pathLength="100" fill="none" stroke="#DDE9E0" stroke-width="16" stroke-linecap="round"/>'
   +'<path d="M12 100 A88 88 0 0 1 188 100" pathLength="100" fill="none" stroke="url(#gg)" stroke-width="16" stroke-linecap="round" stroke-dasharray="'+(gp*100)+' 100"/></svg>'
   +'<div class="gnum"><b>'+esc(g.onboard)+'</b><div class="sub">of '+esc(g.target)+' by '+esc(g.targetDate)+'</div></div>'
   +'<div style="text-align:center">'+tag(g.status)+' <span class="sub">· '+esc(g.daysLeft)+' days left</span></div></div>'
   +'</div>';

  h+='<div class="row"><div class="card attn"><h2>'+(real?real+(real===1?' item needs':' items need')+' attention':'Everything is on track')+'</h2>'
   +(d.attention.length?'<ul>'+d.attention.map(function(a){return '<li><span class="dot '+esc(a.level)+'"></span><span>'+esc(a.text)+'</span></li>'}).join('')+'</ul>':'<p class="empty">Nothing is flagged right now.</p>')
   +'</div>'
   +'<div class="card"><h2>Team progress</h2>'
   +d.team.map(function(t){return '<div class="person"><div class="av">'+esc(String(t.person).charAt(0))+'</div><div class="pbody"><div class="pt"><strong>'+esc(t.person)+'</strong>'+tag(t.status)+'</div>'
     +bar(t.progress)+'<div class="sub">'+esc(t.role)+' · '+esc(t.done)+' of '+esc(t.tasks)+' · '+esc(t.overdue)+' overdue</div></div></div>'}).join('')
   +'<p class="note">Faith counts companies contacted, Shem counts Guides, Esther counts posts.</p></div></div>';

  h+='<div class="row"><div class="card"><h2>Outreach by sector</h2><div class="cols">'
   +d.categories.map(function(c){var p=c.listed?c.contacted/c.listed:0,q=pct(p);
     return '<div class="col" title="'+esc(c.name)+': '+esc(c.contacted)+' of '+esc(c.listed)+'"><b>'+q+'%</b><i class="'+(q<30?'low':(q<70?'mid':''))+'" style="height:'+Math.max(4,q*1.1)+'px"></i><span>'+esc(c.name.replace('Real estate - ','RE · ').replace('Agri - ','Agri · '))+'</span></div>'}).join('')
   +'</div></div>'
   +'<div class="card"><h2>Client leads</h2>'
   +(d.hotLeads.length?'<div class="scroll"><table><thead><tr><th>Company</th><th>Response</th><th>Next step</th></tr></thead><tbody>'
     +d.hotLeads.map(function(l){return '<tr><td><strong>'+esc(l.company)+'</strong><br><span class="sub">'+esc(l.category)+'</span></td><td>'+esc(l.response)+'</td><td>'+esc(l.nextStep||'Not set')+'</td></tr>'}).join('')+'</tbody></table></div>'
     :'<p class="empty">No interested replies yet.</p>')
   +'</div></div>';

  h+='<div class="'+(d.kpis.length?'row':'row')+'"><div class="card"><h2>Open requests between colleagues</h2>'
   +(d.requests.length?'<div class="scroll"><table><thead><tr><th>Task</th><th>From → to</th><th>Deadline</th><th>Check</th></tr></thead><tbody>'
     +d.requests.map(function(r){return '<tr><td>'+esc(r.task)+'</td><td>'+esc(r.by)+' → '+esc(r.to)+'</td><td>'+esc(r.deadline||'none')+'</td><td>'+tag(r.check==='Overdue'?'Needs attention':(r.check==='Add deadline'?'Watch':r.check))+'</td></tr>'}).join('')+'</tbody></table></div>'
     :'<p class="empty">No open requests.</p>')+'</div>';
  if(d.kpis.length){
    h+='<div class="card"><h2>KPIs</h2><div class="scroll"><table><thead><tr><th>Metric</th><th>Owner</th><th>Actual / target</th><th>Status</th></tr></thead><tbody>'
     +d.kpis.map(function(k){return '<tr><td>'+esc(k.metric)+'</td><td>'+esc(k.person)+'</td><td>'+esc(k.actual)+' / '+esc(k.target)+'</td><td>'+tag(k.status)+'</td></tr>'}).join('')+'</tbody></table></div></div>';
  }
  h+='</div>';
  document.getElementById('app').innerHTML=h;
}

function load(){
  var btn=document.getElementById('refresh'),err=document.getElementById('err');
  if(typeof google==='undefined'||!google.script){
    err.style.display='block';
    err.textContent='This page only works when opened from the Apps Script web app link (it starts with https://script.google.com/). In the Apps Script editor, choose Deploy, then New deployment, then Web app, and open that link.';
    document.getElementById('stamp').textContent='Not connected to the sheet';btn.style.display='none';return;
  }
  btn.disabled=true;btn.textContent='Refreshing…';
  google.script.run
    .withSuccessHandler(function(d){err.style.display='none';render(d);btn.disabled=false;btn.textContent='Refresh now'})
    .withFailureHandler(function(e){err.style.display='block';err.textContent='Could not read the sheet: '+(e&&e.message?e.message:e)+'. Check that the tab names and layout have not changed, then press Refresh.';btn.disabled=false;btn.textContent='Refresh now'})
    .getData();
}
document.getElementById('refresh').addEventListener('click',load);
load();
setInterval(load,5*60*1000);
</script>
</body>
</html>
